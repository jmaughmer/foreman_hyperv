---
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - '*-stable'
  schedule:
    - cron: '0 4 * * *'

jobs:
  foreman-5-0:
    name: Foreman 5.0
    uses: theforeman/actions/.github/workflows/foreman_plugin.yml@v1
    with:
      plugin: foreman_hyperv
      foreman_version: 5.0-stable
      additional_packages: libkrb5-dev

  foreman-develop:
    name: Foreman develop
    uses: theforeman/actions/.github/workflows/foreman_plugin.yml@v1
    with:
      plugin: foreman_hyperv
      foreman_version: develop
      additional_packages: libkrb5-dev

  rubocop:
    name: RuboCop
    uses: theforeman/actions/.github/workflows/rubocop.yml@v1
    with:
      ruby: '3.3'
      command: bundle exec rubocop --parallel
