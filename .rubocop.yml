---
inherit_from:
  - .rubocop_todo.yml
plugins:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable

# Don't enforce documentation
Style/Documentation:
  Enabled: false

Style/HashSyntax:
  Enabled: false
  SupportedStyles:
    - ruby19
    - hash_rockets

Metrics/MethodLength:
  Max: 20

Metrics:
  Enabled: false
Naming:
  Enabled: false
