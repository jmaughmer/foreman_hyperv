# The boot disk pull endpoint (foreman_hyperv), plan Decision 2 verbatim.
#
# Install this file as 05-foreman.d/foreman-bootdisk-pull.conf, and — when
# the unattended URL is https — ALSO as 05-foreman-ssl.d/foreman-bootdisk-pull.conf.
# Each Foreman vhost Includes only its own drop-in directory (measured), so
# one copy serves exactly one scheme; the plugin's iso_upload refuses staging
# when a required copy is missing and names this file.
#
# foreman-installer PURGES these drop-in directories (measured 2026-11-24: a
# probe answering HTTP 200 was gone after the next installer run). Copy this
# file into place after EVERY foreman-installer run, then:
#
#     systemctl reload httpd
Alias /bootdisk-pull /var/lib/foreman/bootdisk-transfer
ProxyPass /bootdisk-pull !
<Directory /var/lib/foreman/bootdisk-transfer>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
